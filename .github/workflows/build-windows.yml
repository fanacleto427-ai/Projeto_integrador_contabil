# Manter igual a .github/workflows/build-windows.yml no repositório completo.
# No kit isolado, copiar este arquivo para esse caminho no GitHub.
name: Gerar Importador Dominio Windows

on:
  workflow_dispatch:
  push:
    branches: [agent/windows-ocr]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Localizar os fontes
        shell: pwsh
        run: |
          if (Test-Path "windows/build_windows.py") {
            $root = "."
          } elseif (Test-Path "importador_dominio/windows/build_windows.py") {
            $root = "importador_dominio"
          } else {
            throw "Fonte nao encontrado. Coloque o conteudo do kit na raiz do repositorio."
          }
          "IMPORTADOR_ROOT=$root" >> $env:GITHUB_ENV
      - name: Compilar OCR dos fontes fixados e incluir licencas
        shell: pwsh
        run: |
          New-Item diagnostics -ItemType Directory -Force | Out-Null
          python "$env:IMPORTADOR_ROOT/windows/build_ocr.py" --work-dir "$env:RUNNER_TEMP/ocr-from-sources" 2>&1 | Tee-Object diagnostics/build-ocr.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Gerar e verificar o executavel
        shell: pwsh
        run: |
          python "$env:IMPORTADOR_ROOT/windows/build_windows.py" --ocr-bundle "$env:RUNNER_TEMP/ocr-from-sources/runtime" 2>&1 | Tee-Object diagnostics/build-app.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Transferir somente a candidata para verificacao
        uses: actions/upload-artifact@v4
        with:
          name: candidata-para-verificacao
          path: |
            **/generated-artifacts/windows/ImportadorDominio_Windows.zip
            **/generated-artifacts/windows/ImportadorDominio_Windows.zip.sha256
            **/generated-artifacts/windows/verificacao_empacotamento.json
          if-no-files-found: error
          retention-days: 1
      - name: Conservar diagnosticos sem dados bancarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosticos-compilacao
          path: diagnostics/*.log
          if-no-files-found: warn
          retention-days: 7

  verify:
    needs: build
    # Outra VM: não recebe fontes, bibliotecas ou instalação Python da compilação.
    # É uma imagem hospedada do GitHub, não uma instalação mínima de Windows.
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidata-para-verificacao
          path: transporte
      - name: Conferir OCR em outra VM sem caminhos de desenvolvimento
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem transporte -Recurse -Filter ImportadorDominio_Windows.zip)
          if ($zip.Count -ne 1) { throw "ZIP unico nao encontrado." }
          $hash = (Get-Content "$($zip[0].FullName).sha256").Split(" ")[0]
          if ((Get-FileHash $zip[0].FullName -Algorithm SHA256).Hash -ne $hash) {
            throw "SHA-256 do ZIP divergente."
          }
          $folder = Join-Path $env:RUNNER_TEMP "OCR português sem instalação"
          Expand-Archive $zip[0].FullName $folder
          $app = Join-Path $folder "ImportadorDominio"
          $exe = Join-Path $app "ImportadorDominio.exe"
          $report = Join-Path $env:RUNNER_TEMP "ocr-segunda-vm.json"
          Remove-Item Env:TESSERACT_CMD, Env:TESSDATA_PREFIX -ErrorAction SilentlyContinue
          $env:PATH = Join-Path $env:SystemRoot "System32"
          $arguments = "--require-bundled-ocr --ocr-self-test `"$report`""
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "OCR sintetico falhou na segunda VM." }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne "ok" -or $result.ocr.origem -ne "incluído") {
            throw "OCR incluido nao comprovado."
          }
          $result | Add-Member -NotePropertyName ambiente -NotePropertyValue "GitHub windows-2022; VM separada, PATH System32, sem setup Python ou OCR"
          New-Item evidencias -ItemType Directory | Out-Null
          $result | ConvertTo-Json -Depth 10 | Set-Content evidencias/VERIFICACAO_OCR_SEGUNDA_VM.json -Encoding utf8
          Remove-Item (Join-Path $app "_internal/ocr/tesseract.exe")
          Remove-Item $report
          $missing = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru
          $diagnostic = Get-Content $report -Raw | ConvertFrom-Json
          if ($missing.ExitCode -eq 0 -or $diagnostic.status -ne "erro" -or $diagnostic.erro -notmatch "OCR indisponível") {
            throw "Ausencia de OCR nao reportada."
          }
          Copy-Item $report evidencias/VERIFICACAO_OCR_AUSENTE.json
      - name: Disponibilizar distribuicao e evidencias verificadas
        uses: actions/upload-artifact@v4
        with:
          name: ImportadorDominio-Windows-candidata
          path: |
            transporte/**/ImportadorDominio_Windows.zip
            transporte/**/ImportadorDominio_Windows.zip.sha256
            transporte/**/verificacao_empacotamento.json
            evidencias/*.json
          if-no-files-found: error
          retention-days: 7

  evidence:
    if: always()
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: diagnosticos-compilacao
          path: diagnostics
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ImportadorDominio-Windows-candidata
          path: verified
      - name: Registrar somente resumo e evidencias em branch independente
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          output = pathlib.Path("ocr-evidence")
          output.mkdir()
          summary = {
              "build": os.environ["BUILD_RESULT"],
              "verify": os.environ["VERIFY_RESULT"],
              "source_commit": os.environ["GITHUB_SHA"],
              "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          (output / "result.json").write_text(json.dumps(summary, indent=2))
          for path in pathlib.Path("verified").rglob("*.json"):
              (output / path.name).write_bytes(path.read_bytes())
          for path in pathlib.Path("diagnostics").glob("*.log"):
              text = path.read_text(errors="replace")
              (output / (path.stem + "-tail.txt")).write_text(text[-24000:])
          PY
          git checkout --orphan "ocr-evidence-${GITHUB_RUN_ID}"
          git rm -r --cached . >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ocr-evidence
          git commit -m "Registrar resultado da geracao Windows OCR"
          git push origin "HEAD:refs/heads/ocr-evidence-${GITHUB_RUN_ID}"
